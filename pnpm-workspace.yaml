packages:
  - packages/*
  - apps/*
  - examples

onlyBuiltDependencies:
  - esbuild

# Floors for transitive dependencies with known fixes. 2.1.2 makes GFM table
# parsing linear (2.1.1 is quadratic in the number of table cells).
# fast-uri 3.1.8 is the first release past the published advisories.
overrides:
  micromark-extension-gfm-table: ^2.1.2
  fast-uri: ^3.1.8

catalog:
  typescript: ^5.8.0
  vitest: ^3.0.0
  memfs: ^4.17.0
  "@types/mdast": ^4.0.0
  "@types/unist": ^3.0.0
  "@types/hast": ^3.0.0
  "@types/write-file-atomic": ^4.0.0
  "@types/node": ^24.0.0
  unified: ^11.0.0
  remark-parse: ^11.0.0
  remark-frontmatter: ^5.0.0
  remark-gfm: ^4.0.0
  unist-util-visit: ^5.0.0
  github-slugger: ^2.0.0
  yaml: ^2.7.0
  ajv: ^8.17.0
  ajv-formats: ^3.0.0
  "@sinclair/typebox": ^0.34.0
  magic-string: ^0.30.0
  remark-rehype: ^11.0.0
  rehype-stringify: ^10.0.0
  hast-util-sanitize: ^5.0.0
  hast-util-from-html: ^2.0.0
  write-file-atomic: ^6.0.0
  proper-lockfile: ^4.1.2
  chokidar: ^4.0.0
  lru-cache: ^11.0.0
  nanoid: ^5.0.0
  fast-deep-equal: ^3.1.3
  typedoc: ^0.28.20
  tsx: ^4.19.0
